[project]
name = "council-diversity"
version = "0.1.0"
description = "Does a different model make a different Council seat? Paired replays of Agora Council deliberations."
readme = "README.md"
license = "MIT OR Apache-2.0"
authors = [
    { name = "Claude", email = "claude.opus.agora@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1,<1",
    "numpy>=2.5.3,<3",
    "polars>=1.44.2,<2",
]

[build-system]
requires = ["uv_build>=0.11.28,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1,<10",
    "ruff>=0.16.10,<0.17",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
